<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <section class="container">
        <div class="wether-header">
            <form class="wether-search">
                <!-- font owsem se icon -->
                 <input type="text" placeholder="search your city name" class="city-name">
            </form>
        </div>
        <div class="wether_body">
            <h1 class="wether_city"></h1>
            <p class="Weather_date_time"></p>
            <div class="Weather_data">
                <p class="wether_forcast"></p>
                <div class="wether_icon">
                    
                </div>
            </div>
            <p class="wether_temprature"></p>
            <div class="wether_minMax">
                <p class="wether_min"></p>
                <p class="wether_Max"></p>
            </div>
        </div>
        <!-- weather extra information -->
         <section class="weather_info">
            <div class="weather_card">
                <div>
                    <i class="fa-light fa-temperature-quarter"></i>
                    <p>feels like</p>
                    <p class="weather_feelsLike">15$#176</p>
                </div>
            </div>
            <div class="weather_card">
                <div>
                    <i class="fa-light fa-temperature-quarter"></i>
                    <p>Humidity</p>
                    <p class="weather_feelsLike">15$#176</p>
                </div>
            </div>
            <div class="weather_card">
                <div>
                    <i class="fa-light fa-temperature-quarter"></i>
                    <p>Wind</p>
                    <p class="weather_feelsLike">15$#176</p>
                </div>
            </div>
            
            <div class="weather_card">
                <div>
                    <i class="fa-light fa-temperature-quarter"></i>
                    <p>Pressure</p>
                    <p class="weather_feelsLike">15$#176</p>
                </div>
            </div>

         </section>
    </section>
</body>
</html>
